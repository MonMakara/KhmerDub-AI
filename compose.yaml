services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khmerdub-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - model_cache:/root/.cache
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/data/uploads
      - OUTPUTS_DIR=/app/data/outputs
      - TEMP_DIR=/app/data/temp
      - MODEL_CACHE_DIR=/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: khmerdub-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  model_cache:
    name: khmerdub_model_cache
