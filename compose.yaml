services:
  backend:
    image: khmerdub-ai-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khmerdub-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./fonts:/app/fonts:ro
      - model_cache:/root/.cache
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    env_file:
      - .env
    environment:
      - TZ=Asia/Phnom_Penh
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/data/uploads
      - OUTPUTS_DIR=/app/data/outputs
      - TEMP_DIR=/app/data/temp
      - MODEL_CACHE_DIR=/root/.cache
      - FONTS_DIR=/app/fonts
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: khmerdub-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=Asia/Phnom_Penh
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  model_cache:
    name: khmerdub_model_cache
